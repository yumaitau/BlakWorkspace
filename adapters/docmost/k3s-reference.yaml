apiVersion: apps/v1
kind: Deployment
metadata:
  name: docmost
  namespace: blak-micro
spec:
  replicas: 1
  selector: { matchLabels: { app: docmost } }
  template:
    metadata: { labels: { app: docmost } }
    spec:
      containers:
        - name: docmost
          image: docmost/docmost:latest
          ports: [{ containerPort: 3000 }]
          env:
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: blak-core, key: postgres-password } } }
            - { name: DATABASE_URL, value: 'postgresql://blak:$(POSTGRES_PASSWORD)@postgres:5432/docmost' }
            - { name: REDIS_URL, value: 'redis://valkey:6379' }
            - { name: APP_URL, value: 'http://sites.workspace.example.com' }
            - { name: APP_SECRET, value: 'gCDj2lfSIWEr_SE5hmh5nChZZS3V0e-xs29a-NQD_uqa-bulHpHwfg' }
          readinessProbe: { tcpSocket: { port: 3000 }, initialDelaySeconds: 30, periodSeconds: 15 }
          livenessProbe: { tcpSocket: { port: 3000 }, initialDelaySeconds: 120, periodSeconds: 30 }
---
apiVersion: v1
kind: Service
metadata:
  name: sites
  namespace: blak-micro
spec:
  selector: { app: docmost }
  ports: [{ name: http, port: 3000, targetPort: 3000 }]
