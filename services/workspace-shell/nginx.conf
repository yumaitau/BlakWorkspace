# Same-origin assets preserve upstream CSP. APIs, streams and websockets pass through.
map_hash_bucket_size 128;
# Only document navigation gets HTML fallbacks. Fetch/API responses pass through.
map $http_accept $blak_accepts_html {
  default 0;
  "~*text/html\s*;\s*q=0(?:\.0*)?(?:,|$)" 0;
  ~*text/html 1;
}
map $http_sec_fetch_mode $blak_navigation_mode {
  default 0;
  '' $blak_accepts_html;
  navigate 1;
}
map $http_sec_fetch_dest $blak_browser_navigation {
  default 0;
  '' $blak_navigation_mode;
  document 1;
  iframe 1;
  frame 1;
}

map $blak_browser_navigation $blak_error_format { default json; 1 html; }
map $http_upgrade $blak_connection { default upgrade; '' ''; }
map $host $blak_upstream {
  default '';
  monitoring.workspace.example.com beszel.blak-micro.svc.cluster.local:8090;
  portal.workspace.example.com portal.blak-micro.svc.cluster.local:3000;
  drive.workspace.example.com drive.blak-micro.svc.cluster.local:9200;
  sites.workspace.example.com sites.blak-micro.svc.cluster.local:3000;
  projects.workspace.example.com projects.blak-micro.svc.cluster.local:5173;
  crm.workspace.example.com crm.blak-micro.svc.cluster.local:3000;
  forms.workspace.example.com forms.blak-micro.svc.cluster.local:9157;
  chat.workspace.example.com chat.blak-micro.svc.cluster.local:3000;
  hermes.workspace.example.com hermes.blak-micro.svc.cluster.local:8080;
  vault.workspace.example.com vault.blak-micro.svc.cluster.local:8080;
  docs.workspace.example.com docs.blak-micro.svc.cluster.local:9980;
  cloud.workspace.example.com floci-ui.blak-micro.svc.cluster.local:4500;
  smith.workspace.example.com smith.blak-micro.svc.cluster.local:3000;
  eyes.workspace.example.com eyes.blak-micro.svc.cluster.local:8765;
}
# Portal owns its detailed recovery pages (including partly completed actions).
map "$blak_browser_navigation:$blak_upstream" $blak_gateway_errors {
  default $blak_browser_navigation;
  ~^1:portal\.blak-micro\.svc\.cluster\.local:3000$ 0;
}
# Authentik and Vault keep their own pages. The shell adds Home on top.
map $blak_upstream $blak_assets {
  default '<link rel="stylesheet" href="/_blak/shell.css"><script src="/_blak/shell.js" defer></script>';
  authentik-server.blak-micro.svc.cluster.local:9000 '<link rel="stylesheet" href="/_blak/fonts.css"><link rel="stylesheet" href="/_blak/shell.css"><script src="/_blak/shell.js" defer></script>';
  vault.blak-micro.svc.cluster.local:8080 '<link rel="stylesheet" href="/_blak/shell.css"><script src="/_blak/shell.js" defer></script>';
}
# Standalone portal recovery pages already include their own brand and Home link.
map $upstream_http_x_blak_error_page $blak_response_assets {
  default $blak_assets;
  1 '';
}
map "$blak_upstream:$uri" $blak_vault_admin {
  default 0;
  ~^vault\.blak-micro\.svc\.cluster\.local:8080:/admin(?:/|$) 1;
}
map $blak_upstream $blak_cloud_guard {
  default "";
  floci-ui.blak-micro.svc.cluster.local:4500 "1";
}
server {
  listen 8080;
  access_log off;
  error_page 404 /_blak/errors/404.$blak_error_format;
  error_page 421 /_blak/errors/421.$blak_error_format;
  error_page 500 /_blak/errors/500.$blak_error_format;
  error_page 502 /_blak/errors/502.$blak_error_format;
  error_page 503 /_blak/errors/503.$blak_error_format;
  error_page 504 /_blak/errors/504.$blak_error_format;
  resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
  client_max_body_size 0;
  location = /healthz { return 200 'ok'; }
  location = /_blak_guard {
    internal;
    if ($blak_cloud_guard = "") { return 204; }
    proxy_method GET;
    proxy_pass http://portal.blak-micro.svc.cluster.local:3000/api/cloud-access;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
  }
  location ^~ /_blak/errors/ {
    internal;
    root /usr/share/nginx/html;
    add_header Cache-Control 'no-store' always;
    add_header Vary 'Accept, Sec-Fetch-Dest, Sec-Fetch-Mode' always;
    add_header X-Content-Type-Options nosniff always;
  }
  location /_blak/ {
    root /usr/share/nginx/html;
    add_header Cache-Control 'no-cache';
    add_header X-Content-Type-Options nosniff;
  }
  # WOPI tokens are validated by OpenCloud collaboration; no HTML injection here.
  location ^~ /wopi/ {
    if ($host != drive.workspace.example.com) { return 404; }
    proxy_pass http://drive.blak-micro.svc.cluster.local:9300;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 3600s;
  }
  location / {
    if ($blak_vault_admin) { return 404; }
    error_page 404 /_blak/errors/404.$blak_error_format;
    error_page 421 /_blak/errors/421.$blak_error_format;
    error_page 500 /_blak/errors/500.$blak_error_format;
    error_page 502 /_blak/errors/502.$blak_error_format;
    error_page 503 /_blak/errors/503.$blak_error_format;
    error_page 504 /_blak/errors/504.$blak_error_format;
    recursive_error_pages on;
    error_page 418 = @blak_browser;
    if ($blak_gateway_errors) { return 418; }
    auth_request /_blak_guard;
    error_page 401 = @signed_out;
    if ($blak_upstream = '') { return 421; }
    proxy_pass http://$blak_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $blak_connection;
    proxy_set_header Accept-Encoding '';
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    sub_filter_once off;
    sub_filter '<title>Floci UI</title>' '<title>Blak Cloud</title>';
    sub_filter 'data-auto-show-welcome = "true"' 'data-auto-show-welcome = "false"';
    sub_filter 'data-enable-welcome-message = "true"' 'data-enable-welcome-message = "false"';
    sub_filter 'data-auto-show-feedback = "true"' 'data-auto-show-feedback = "false"';
    sub_filter '</head>' '$blak_response_assets</head>';
  }
  # Named routing keeps the original method and body; each request is proxied once.
  location @blak_browser {
    recursive_error_pages on;
    proxy_intercept_errors on;
    error_page 404 /_blak/errors/404.html;
    error_page 421 /_blak/errors/421.html;
    error_page 500 /_blak/errors/500.html;
    error_page 502 /_blak/errors/502.html;
    error_page 503 /_blak/errors/503.html;
    error_page 504 /_blak/errors/504.html;
    auth_request /_blak_guard;
    error_page 401 = @signed_out;
    if ($blak_upstream = '') { return 421; }
    proxy_pass http://$blak_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $blak_connection;
    proxy_set_header Accept-Encoding '';
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    sub_filter_once off;
    sub_filter '<title>Floci UI</title>' '<title>Blak Cloud</title>';
    sub_filter 'data-auto-show-welcome = "true"' 'data-auto-show-welcome = "false"';
    sub_filter 'data-enable-welcome-message = "true"' 'data-enable-welcome-message = "false"';
    sub_filter 'data-auto-show-feedback = "true"' 'data-auto-show-feedback = "false"';
    sub_filter '</head>' '$blak_response_assets</head>';
  }
  location @signed_out {
    if ($blak_cloud_guard = "1") { return 302 https://portal.workspace.example.com/login; }
    return 401;
  }
}
