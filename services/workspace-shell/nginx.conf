# Same-origin assets preserve upstream CSP. APIs, streams and websockets pass through.
map $http_upgrade $blak_connection { default upgrade; '' ''; }
map $host $blak_upstream {
  default '';
  portal.homelab.local portal.blak-micro.svc.cluster.local:3000;
  drive.homelab.local drive.blak-micro.svc.cluster.local:9200;
  sites.homelab.local sites.blak-micro.svc.cluster.local:3000;
  projects.homelab.local projects.blak-micro.svc.cluster.local:5173;
  crm.homelab.local crm.blak-micro.svc.cluster.local:3000;
  forms.homelab.local forms.blak-micro.svc.cluster.local:9157;
  chat.homelab.local chat.blak-micro.svc.cluster.local:3000;
  hermes.homelab.local hermes.blak-micro.svc.cluster.local:8080;
  docs.homelab.local docs.blak-micro.svc.cluster.local:9980;
}
server {
  listen 8080;
  access_log off;
  resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
  client_max_body_size 0;
  location = /healthz { return 200 'ok'; }
  location /_blak/ {
    root /usr/share/nginx/html;
    add_header Cache-Control 'no-cache';
    add_header X-Content-Type-Options nosniff;
  }
  location / {
    if ($blak_upstream = '') { return 421; }
    proxy_pass http://$blak_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $blak_connection;
    proxy_set_header Accept-Encoding '';
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    sub_filter_once on;
    sub_filter '</head>' '<link rel="stylesheet" href="/_blak/shell.css"><script src="/_blak/shell.js" defer></script></head>';
  }
}
