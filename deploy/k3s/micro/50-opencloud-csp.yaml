apiVersion: v1
kind: ConfigMap
metadata:
  name: drive-csp
  namespace: blak-micro
data:
  csp.yaml: |
    # Upstream defaults plus Blak ID, Docs and the authenticated workspace switcher.
    # Mounted at /etc/opencloud/csp.yaml, referenced via PROXY_CSP_CONFIG_FILE_LOCATION.
    directives:
      child-src:
        - '''self'''
      connect-src:
        - '''self'''
        - 'https://portal.workspace.example.com/'
        - 'blob:'
        - 'https://raw.githubusercontent.com/opencloud-eu/awesome-apps/'
        - 'https://update.opencloud.eu/'
        - 'http://id.workspace.example.com/'
        - 'https://id.workspace.example.com/'
        - 'http://docs.workspace.example.com/'
        - 'https://docs.workspace.example.com/'
      default-src:
        - '''none'''
      font-src:
        - '''self'''
      frame-ancestors:
        - '''self'''
      frame-src:
        - '''self'''
        - 'blob:'
        - 'https://embed.diagrams.net/'
        - 'http://docs.workspace.example.com/'
        - 'https://docs.workspace.example.com/'
        - 'http://id.workspace.example.com/'
        - 'https://id.workspace.example.com/'
      img-src:
        - '''self'''
        - 'data:'
        - 'blob:'
        - 'https://raw.githubusercontent.com/opencloud-eu/awesome-apps/'
        - 'http://docs.workspace.example.com/'
        - 'https://docs.workspace.example.com/'
        - 'http://id.workspace.example.com/'
        - 'https://id.workspace.example.com/'
      manifest-src:
        - '''self'''
      media-src:
        - '''self'''
      object-src:
        - '''self'''
        - 'blob:'
      script-src:
        - '''self'''
        - '''unsafe-inline'''
        - 'http://id.workspace.example.com/'
        - 'https://id.workspace.example.com/'
      style-src:
        - '''self'''
        - '''unsafe-inline'''
        - 'blob:'
