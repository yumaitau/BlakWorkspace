# Flow definitions and run history survive portal replacement.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: portal-flow-data
  namespace: blak-micro
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 1Gi }
---
# Secrets for blak-portal live in-cluster (scripts/deploy/ensure-secrets.sh). Never commit them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: blak-micro
spec:
  replicas: 1
  # The encrypted session journal has one writer; retain it across restarts.
  strategy:
    type: Recreate
  selector: { matchLabels: { app: portal } }
  template:
    metadata: { labels: { app: portal } }
    spec:
      hostAliases:
        - ip: 10.43.169.184
          hostnames: [id.workspace.example.com]
      volumes:
        - name: sync-health
          persistentVolumeClaim: { claimName: hermes-sync-state }
        - name: ca
          configMap: { name: blak-ca }
        - name: flow-store
          persistentVolumeClaim: { claimName: portal-flow-data }
        - name: knowledge-export
          secret: { secretName: blak-portal-exports, optional: true }
      containers:
        - name: portal
          image: blak-portal:micro
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          env:
            - { name: SYNC_HEALTH_FILE, value: /sync-health/health.json }
            - { name: PORT, value: "3000" }
            - { name: KNOWLEDGE_EXPORT_ACCOUNTS, value: /exports/accounts.json }
            - { name: FLOW_STORE, value: /data/blak-flow.json }
            - { name: OIDC_ISSUER, value: https://id.workspace.example.com/application/o/blak-portal/ }
            - { name: OIDC_AUTH_URL, value: https://id.workspace.example.com/application/o/authorize/ }
            - { name: OIDC_CLIENT_ID, value: blak-portal }
            - { name: OIDC_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: blak-portal, key: oidc-secret } } }
            - { name: OIDC_REDIRECT_URI, value: https://portal.workspace.example.com/callback }
            - { name: OIDC_BASE, value: https://id.workspace.example.com/application/o }
            - { name: MEILI_MASTER_KEY, valueFrom: { secretKeyRef: { name: blak-core, key: meili-master-key } } }
            - { name: FLOCI_PORT, value: "4566" }
            - { name: FLOCI_UI_HOST, value: floci-ui }
            - { name: FLOCI_UI_PORT, value: "4500" }
            - { name: CLOUD_PUBLIC_URL, value: https://cloud.workspace.example.com }
            - { name: SESSION_SECRET, valueFrom: { secretKeyRef: { name: blak-portal, key: session-secret } } }
            - { name: NODE_EXTRA_CA_CERTS, value: /certs/rootCA.pem }
          volumeMounts:
            - { name: sync-health, mountPath: /sync-health, readOnly: true }
            - { name: ca, mountPath: /certs/rootCA.pem, subPath: rootCA.pem }
            - { name: flow-store, mountPath: /data }
            - { name: knowledge-export, mountPath: /exports, readOnly: true }
          readinessProbe: { httpGet: { path: /api/health, port: 3000 }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /api/health, port: 3000 }, initialDelaySeconds: 15, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: blak-micro
spec:
  selector: { app: portal }
  ports: [{ port: 3000, targetPort: 3000 }]
