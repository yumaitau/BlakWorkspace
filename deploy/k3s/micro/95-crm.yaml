apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frappe-db-data
  namespace: blak-micro
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frappe-cache-data
  namespace: blak-micro
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frappe-sites
  namespace: blak-micro
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 3Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-db
  namespace: blak-micro
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frappe-db
  template:
    metadata:
      labels:
        app: frappe-db
    spec:
      containers:
      - name: frappe-db
        image: mariadb:10.11
        args:
        - --character-set-server=utf8mb4
        - --collation-server=utf8mb4_unicode_ci
        env:
        - name: MARIADB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: blak-frappe
              key: database-password
        ports:
        - containerPort: 3306
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '2'
            memory: 768Mi
        readinessProbe:
          tcpSocket:
            port: 3306
          periodSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: frappe-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: frappe-db
  namespace: blak-micro
spec:
  selector:
    app: frappe-db
  ports:
  - port: 3306
    targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-cache
  namespace: blak-micro
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frappe-cache
  template:
    metadata:
      labels:
        app: frappe-cache
    spec:
      containers:
      - name: frappe-cache
        image: valkey/valkey:7.2-alpine
        args:
        - --appendonly
        - 'yes'
        env: []
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '2'
            memory: 768Mi
        readinessProbe:
          tcpSocket:
            port: 6379
          periodSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: frappe-cache-data
---
apiVersion: v1
kind: Service
metadata:
  name: frappe-cache
  namespace: blak-micro
spec:
  selector:
    app: frappe-cache
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-crm
  namespace: blak-micro
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frappe-crm
  template:
    metadata:
      labels:
        app: frappe-crm
    spec:
      containers:
      - name: backend
        image: blak-frappe:crm1.84.0-frappe15.121.0-blak3
        imagePullPolicy: IfNotPresent
        args:
        - start.sh
        env:
        - &id001
          name: REQUESTS_CA_BUNDLE
          value: /etc/blak-trust/ca.pem
        - name: GUNICORN_WORKERS
          value: '2'
        volumeMounts:
        - &id002
          name: sites
          mountPath: /home/frappe/frappe-bench/sites
        - &id003
          name: ca
          mountPath: /etc/blak-ca
          readOnly: true
        - name: trust
          mountPath: /etc/blak-trust
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: '2'
            memory: 1Gi
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /api/method/ping
            port: 8000
            httpHeaders:
            - name: Host
              value: crm.workspace.example.com
          periodSeconds: 10
      - name: frontend
        image: blak-frappe:crm1.84.0-frappe15.121.0-blak3
        imagePullPolicy: IfNotPresent
        args:
        - nginx-entrypoint.sh
        env:
        - *id001
        - name: BACKEND
          value: 127.0.0.1:8000
        - name: SOCKETIO
          value: 127.0.0.1:9000
        - name: FRAPPE_SITE_NAME_HEADER
          value: crm.workspace.example.com
        - name: UPSTREAM_REAL_IP_ADDRESS
          value: 127.0.0.1
        - name: UPSTREAM_REAL_IP_HEADER
          value: X-Forwarded-For
        - name: UPSTREAM_REAL_IP_RECURSIVE
          value: 'off'
        volumeMounts:
        - *id002
        - *id003
        - name: trust
          mountPath: /etc/blak-trust
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: '2'
            memory: 256Mi
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /api/method/ping
            port: 8080
          periodSeconds: 10
      - name: websocket
        image: blak-frappe:crm1.84.0-frappe15.121.0-blak3
        imagePullPolicy: IfNotPresent
        args:
        - node
        - apps/frappe/socketio.js
        env:
        - *id001
        volumeMounts:
        - *id002
        - *id003
        - name: trust
          mountPath: /etc/blak-trust
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: '2'
            memory: 256Mi
        ports:
        - containerPort: 9000
      - name: worker
        image: blak-frappe:crm1.84.0-frappe15.121.0-blak3
        imagePullPolicy: IfNotPresent
        args:
        - bench
        - worker
        - --queue
        - short,default,long
        env:
        - *id001
        volumeMounts:
        - *id002
        - *id003
        - name: trust
          mountPath: /etc/blak-trust
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: '2'
            memory: 768Mi
      - name: scheduler
        image: blak-frappe:crm1.84.0-frappe15.121.0-blak3
        imagePullPolicy: IfNotPresent
        args:
        - bench
        - schedule
        env:
        - *id001
        volumeMounts:
        - *id002
        - *id003
        - name: trust
          mountPath: /etc/blak-trust
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: '2'
            memory: 256Mi
      volumes:
      - name: sites
        persistentVolumeClaim:
          claimName: frappe-sites
      - name: ca
        configMap:
          name: blak-ca
      - name: setup
        configMap:
          name: blak-frappe-setup
      - name: themes
        configMap:
          name: blak-app-themes
      - name: trust
        emptyDir: {}
      securityContext:
        fsGroup: 1000
      hostAliases:
      - ip: 10.43.169.184
        hostnames:
        - id.workspace.example.com
      initContainers:
      - name: configure
        image: blak-frappe:crm1.84.0-frappe15.121.0-blak3
        imagePullPolicy: IfNotPresent
        args:
        - bash
        - -ec
        - cat /etc/ssl/certs/ca-certificates.crt /etc/blak-ca/rootCA.pem > /etc/blak-trust/ca.pem;
          env/bin/python /setup/setup.py; cp /themes/crm.css sites/crm.workspace.example.com/public/files/blak-crm.css
        env:
        - *id001
        - name: DB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: blak-frappe
              key: database-password
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: blak-frappe
              key: admin-password
        - name: OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: blak-frappe
              key: client-id
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: blak-frappe
              key: oidc-secret
        - name: CRM_USERS
          valueFrom:
            secretKeyRef:
              name: blak-frappe
              key: users.json
        volumeMounts:
        - *id002
        - *id003
        - name: setup
          mountPath: /setup
          readOnly: true
        - name: themes
          mountPath: /themes
          readOnly: true
        - name: trust
          mountPath: /etc/blak-trust
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 2Gi
      enableServiceLinks: false
---
apiVersion: v1
kind: Service
metadata:
  name: frappe-crm
  namespace: blak-micro
spec:
  selector:
    app: frappe-crm
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: crm
  namespace: blak-micro
spec:
  selector:
    app: frappe-crm
  ports:
  - port: 3000
    targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: crm
  namespace: blak-micro
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`crm.workspace.example.com`)
    services:
    - name: crm
      port: 3000
  tls:
    secretName: blak-wildcard
