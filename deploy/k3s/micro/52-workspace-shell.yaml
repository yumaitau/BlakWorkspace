apiVersion: apps/v1
kind: Deployment
metadata: {name: workspace-shell, namespace: blak-micro}
spec:
  replicas: 1
  selector: {matchLabels: {app: workspace-shell}}
  template:
    metadata: {labels: {app: workspace-shell}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsUser: 101, runAsGroup: 101, fsGroup: 101}
      containers:
        - name: shell
          image: blak-workspace-shell:micro
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: nginx-run, mountPath: /var/run}
            - {name: nginx-cache, mountPath: /var/cache/nginx}
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 15}
      volumes:
        - {name: nginx-run, emptyDir: {}}
        - {name: nginx-cache, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: workspace-shell, namespace: blak-micro}
spec:
  selector: {app: workspace-shell}
  ports: [{port: 8080, targetPort: 8080}]
