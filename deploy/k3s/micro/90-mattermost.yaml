# Blak Chat backend: Mattermost Team Edition.
# NOTE: Team Edition has no free SSO — OIDC/SAML/LDAP are Enterprise-gated upstream.
# Runs on local accounts (same emails as Blak ID) until a licence decision or a
# swap to an SSO-capable chat backend. Presented as Blak Chat with attribution.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mattermost-data
  namespace: blak-micro
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 10Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mattermost
  namespace: blak-micro
spec:
  replicas: 1
  selector: { matchLabels: { app: mattermost } }
  template:
    metadata: { labels: { app: mattermost } }
    spec:
      hostAliases:
        - ip: 10.43.169.184
          hostnames: [id.homelab.local]
      containers:
        - name: mattermost
          image: mattermost/mattermost-team-edition:10.8
          ports: [{ containerPort: 8065 }]
          env:
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: blak-core, key: postgres-password } } }
            - { name: MM_SQLSETTINGS_DATASOURCE, value: 'postgres://blak:$(POSTGRES_PASSWORD)@postgres:5432/mattermost?sslmode=disable&connect_timeout=10' }
            - { name: MM_SERVICESETTINGS_SITEURL, value: http://chat.homelab.local }
            - { name: MM_SERVICESETTINGS_ENABLEDEVELOPER, value: "false" }
            - { name: MM_EMAILSETTINGS_ENABLESIGNUPWITHEMAIL, value: "true" }
            - { name: MM_TEAMSETTINGS_ENABLEOPENSERVER, value: "true" }
          readinessProbe: { httpGet: { path: /api/v4/system/ping, port: 8065 }, initialDelaySeconds: 60, periodSeconds: 15 }
          livenessProbe: { httpGet: { path: /api/v4/system/ping, port: 8065 }, initialDelaySeconds: 180, periodSeconds: 30 }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "2", memory: 4Gi }
          volumeMounts: [{ name: data, mountPath: /mattermost/data }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: mattermost-data } }]
---
apiVersion: v1
kind: Service
metadata:
  name: chat
  namespace: blak-micro
spec:
  selector: { app: mattermost }
  ports: [{ name: http, port: 8065, targetPort: 8065 }]
