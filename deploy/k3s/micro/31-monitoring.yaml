apiVersion: v1
kind: ServiceAccount
metadata:
  name: portal-monitor
  namespace: blak-micro
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: blak-portal-monitor
rules:
  - apiGroups: ['']
    resources: [nodes]
    verbs: [list]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: blak-portal-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: blak-portal-monitor
subjects:
  - kind: ServiceAccount
    name: portal-monitor
    namespace: blak-micro
