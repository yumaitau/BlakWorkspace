# BlakEyes listens with TLS on the pod IP so remote bootstrap stays refused.
# Sign-in is Blak ID after the directory sync. The image leaves out the ml extra.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eyes-data
  namespace: blak-micro
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 20Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eyes
  namespace: blak-micro
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: eyes } }
  template:
    metadata: { labels: { app: eyes } }
    spec:
      imagePullSecrets: [{ name: ghcr-pull }]
      initContainers:
        - name: tls
          image: ghcr.io/yumaitau/blakeyes:sha-65e0dd4
          imagePullPolicy: IfNotPresent
          securityContext: { runAsUser: 0 }
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              umask 077
              openssl req -x509 -newkey rsa:2048 -keyout /tls/key.pem -out /tls/cert.pem \
                -days 825 -nodes -subj /CN=eyes.workspace.example.com
              chown -R 1000:1000 /tls /var/lib/blakeyes
              chmod 600 /tls/key.pem
              chmod 644 /tls/cert.pem
          volumeMounts:
            - { name: tls, mountPath: /tls }
            - { name: data, mountPath: /var/lib/blakeyes }
      containers:
        - name: eyes
          image: ghcr.io/yumaitau/blakeyes:sha-65e0dd4
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8766 }]
          env:
            - { name: BLAKEYES_HOST, value: 0.0.0.0 }
            - { name: BLAKEYES_PORT, value: "8766" }
            - { name: BLAKEYES_HOME, value: /var/lib/blakeyes }
            - { name: BLAKEYES_LIBRARY_ROOT, value: /var/lib/blakeyes/library }
            - { name: BLAKEYES_SSL_CERTFILE, value: /tls/cert.pem }
            - { name: BLAKEYES_SSL_KEYFILE, value: /tls/key.pem }
            - { name: BLAKEYES_TRUSTED_HOSTS, value: "eyes,eyes:8765,eyes.workspace.example.com,localhost,127.0.0.1" }
            - { name: BLAKEYES_PUBLIC_URL, value: https://eyes.workspace.example.com }
            - { name: BLAKEYES_OIDC_ISSUER, value: https://id.workspace.example.com/application/o/blak-eyes/ }
            - { name: BLAKEYES_OIDC_CLIENT_ID, value: blak-eyes }
            - name: BLAKEYES_OIDC_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: blak-eyes, key: oidc-secret } }
            - { name: BLAKEYES_OIDC_PROVIDER_ID, value: blak-id }
            - { name: BLAKEYES_SCIM_PROVIDER_ID, value: blak-id-scim }
            - name: BLAKEYES_SCIM_ORGANIZATION_ID
              valueFrom: { secretKeyRef: { name: blak-eyes, key: organization-id } }
            - name: BLAKEYES_SCIM_SECRET
              valueFrom: { secretKeyRef: { name: blak-eyes, key: scim-secret } }
            - { name: BLAKEYES_ALLOWED_IMPORT_ROOTS, value: /var/lib/blakeyes }
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - import urllib.request,ssl; urllib.request.urlopen('https://127.0.0.1:8766/api/health', context=ssl._create_unverified_context(), timeout=4)
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 4Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/blakeyes }
            - { name: tls, mountPath: /tls, readOnly: true }
        - name: proxy
          image: nginx:1.27-alpine
          env:
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              rm -f /etc/nginx/conf.d/default.conf
              cat > /etc/nginx/conf.d/eyes.conf <<EOF
              server {
                listen 8765;
                client_max_body_size 0;
                location / {
                  proxy_pass https://${POD_IP}:8766;
                  proxy_ssl_verify off;
                  proxy_ssl_server_name on;
                  proxy_set_header Host \$http_host;
                  proxy_http_version 1.1;
                  proxy_read_timeout 3600s;
                }
              }
              EOF
              exec nginx -g 'daemon off;'
          ports: [{ containerPort: 8765 }]
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8765
              httpHeaders: [{ name: Host, value: eyes.workspace.example.com }]
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: eyes-data } }
        - { name: tls, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: eyes
  namespace: blak-micro
spec:
  selector: { app: eyes }
  ports: [{ name: http, port: 8765, targetPort: 8765 }]
