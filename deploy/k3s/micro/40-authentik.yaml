apiVersion: v1
kind: Secret
metadata:
  name: blak-idp
  namespace: blak-micro
type: Opaque
stringData:
  secret-key: "FxL6Xtu4X_FZXvA9kFuZDC_f6alZHjlLuVQ-JSJWRlFE9b9rTZUI2hcrU0O2Eeo9"
  bootstrap-password: "Blak-1KBXzDQc8i4Hh2k-OhseYZeL"
  bootstrap-email: "admin@blak.local"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-server
  namespace: blak-micro
spec:
  replicas: 1
  selector: { matchLabels: { app: authentik-server } }
  template:
    metadata: { labels: { app: authentik-server } }
    spec:
      containers:
        - name: server
          image: ghcr.io/goauthentik/server:2025.6
          args: ["server"]
          ports: [{ containerPort: 9000 }]
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "2", memory: 4Gi }
          env:
            - { name: AUTHENTIK_SECRET_KEY, valueFrom: { secretKeyRef: { name: blak-idp, key: secret-key } } }
            - { name: AUTHENTIK_POSTGRESQL__HOST, value: postgres }
            - { name: AUTHENTIK_POSTGRESQL__USER, value: blak }
            - { name: AUTHENTIK_POSTGRESQL__NAME, value: authentik }
            - { name: AUTHENTIK_POSTGRESQL__PASSWORD, valueFrom: { secretKeyRef: { name: blak-core, key: postgres-password } } }
            - { name: AUTHENTIK_REDIS__HOST, value: valkey }
            - { name: AUTHENTIK_LISTEN__HTTP, value: "0.0.0.0:9000" }
            - { name: AUTHENTIK_DISABLE_UPDATE_CHECK, value: "true" }
            - { name: AUTHENTIK_ERROR_REPORTING__ENABLED, value: "false" }
            - { name: AUTHENTIK_BOOTSTRAP_EMAIL, valueFrom: { secretKeyRef: { name: blak-idp, key: bootstrap-email } } }
            - { name: AUTHENTIK_BOOTSTRAP_PASSWORD, valueFrom: { secretKeyRef: { name: blak-idp, key: bootstrap-password } } }
          readinessProbe: { httpGet: { path: /-/health/ready/, port: 9000 }, initialDelaySeconds: 30, periodSeconds: 15 }
          livenessProbe: { httpGet: { path: /-/health/live/, port: 9000 }, initialDelaySeconds: 60, periodSeconds: 30 }
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-server
  namespace: blak-micro
spec:
  selector: { app: authentik-server }
  ports: [{ name: http, port: 9000, targetPort: 9000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-worker
  namespace: blak-micro
spec:
  replicas: 1
  selector: { matchLabels: { app: authentik-worker } }
  template:
    metadata: { labels: { app: authentik-worker } }
    spec:
      containers:
        - name: worker
          image: ghcr.io/goauthentik/server:2025.6
          args: ["worker"]
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "2", memory: 4Gi }
          env:
            - { name: AUTHENTIK_SECRET_KEY, valueFrom: { secretKeyRef: { name: blak-idp, key: secret-key } } }
            - { name: AUTHENTIK_POSTGRESQL__HOST, value: postgres }
            - { name: AUTHENTIK_POSTGRESQL__USER, value: blak }
            - { name: AUTHENTIK_POSTGRESQL__NAME, value: authentik }
            - { name: AUTHENTIK_POSTGRESQL__PASSWORD, valueFrom: { secretKeyRef: { name: blak-core, key: postgres-password } } }
            - { name: AUTHENTIK_REDIS__HOST, value: valkey }
            - { name: AUTHENTIK_DISABLE_UPDATE_CHECK, value: "true" }
            - { name: AUTHENTIK_ERROR_REPORTING__ENABLED, value: "false" }
