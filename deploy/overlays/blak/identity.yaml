# Identity overlay intent. Nubus is the baseline IdP. Do not invent a second IdP.
identity:
  idp: nubus
  protocol: oidc
  issuer: nubus-keycloak
  personas: site-owner,site-admin,member,contributor,reader
  entraFederation: false
  lifecycle: join,move,leave
  guestDefault: deny
  auditEvents: authn.success,authn.failure,member.add,member.remove,role.change
