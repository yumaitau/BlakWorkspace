name: e2e-nightly

# Browser and e2e suites run only here, on the nightly schedule, never in push
# or pull request CI (validate.yml).
on:
  schedule:
    # 15:00 UTC = 02:00 AEDT.
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  browser-network-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the offline browser network gate
        working-directory: e2e
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          npx playwright test local-network-guard.spec.js --reporter=list
