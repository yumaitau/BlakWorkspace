name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate backlog manifest
        run: python scripts/validate-manifest.py
      - name: Install deployment manifest parser
        run: python -m pip install PyYAML==6.0.3
      - name: Minimal config tests
        run: python -m unittest discover -s tests -v
      - name: Install portal dependencies
        run: npm ci --prefix apps/portal --ignore-scripts
      - name: Portal regression tests
        run: node --test apps/portal/test/*.test.js
      - name: Build Draw frontend
        working-directory: apps/portal/draw
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Hermes sync tests
        run: python -m unittest discover -s services/hermes-sync -p 'test_*.py' -v
      - name: Backup failure regression tests
        run: python -m unittest discover -s scripts/deploy/backup -p 'test_*.py' -v
      - name: Check generated app themes
        run: node scripts/brand/generate.js --check
      - name: Generate SBOM
        run: python scripts/generate_sbom.py
